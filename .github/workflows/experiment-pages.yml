name: Publish next-action experiment preview
on:
  push:
    branches:
      - ux-next-action-experiment
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: connector-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
      - name: Prepare branch-specific preview path
        run: |
          mkdir -p dist/ux-next-action-experiment
          cp index.html app.js app-meta.js styles.css ux-v06.css manifest.webmanifest icon.svg sw.js dist/ux-next-action-experiment/
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
